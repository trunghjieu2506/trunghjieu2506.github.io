<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About — Trung Hieu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbf9f4;
    --text: #1a1a1a;
    --text-muted: #5a5a5a;
    --accent: #8a2c2c;
    --rule: #d8d3c7;
    --link: #8a2c2c;
    --link-hover: #b03838;
    --max-width: 1180px;
    --content-width: 720px;
  }

  * { box-sizing: border-box; }

  html {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Source Serif 4', 'Source Serif Pro', Georgia, serif;
    font-size: 18px;
    line-height: 1.55;
    font-feature-settings: "kern" 1, "liga" 1, "onum" 1;
  }

  /* ────────── HEADER ────────── */
  .site-header {
    border-bottom: 1px solid var(--rule);
    padding: 22px 0 18px;
    margin-bottom: 36px;
  }
  .site-header-inner {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: baseline;
    gap: 28px;
    font-size: 17px;
  }
  .site-header a {
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .site-header a:hover { color: var(--accent); }
  .site-header .nav-spacer { flex: 1; }
  .site-header .nav-active { color: var(--accent); }

  /* ────────── LAYOUT ────────── */
  .page {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 0 32px 120px;
  }

  .content { max-width: var(--content-width); }

  /* ────────── ABOUT ────────── */
  h1.name {
    font-size: 38px;
    line-height: 1.15;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 20px;
  }

  p {
    margin: 0 0 16px;
    color: var(--text);
  }

  a {
    color: var(--link);
    text-decoration: none;
    border-bottom: 1px solid rgba(138, 44, 44, 0.3);
    transition: border-color 0.15s, color 0.15s;
  }
  a:hover {
    color: var(--link-hover);
    border-bottom-color: var(--link-hover);
  }

  .rule {
    height: 1px;
    background: var(--rule);
    margin: 40px 0;
    border: none;
  }

  .links {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }

  .links li {
    font-size: 15px;
  }

  /* ────────── RESPONSIVE ────────── */
  @media (max-width: 720px) {
    body { font-size: 17px; }
    .page, .site-header-inner { padding: 0 20px; }
    .site-header-inner { gap: 18px; flex-wrap: wrap; }
    h1.name { font-size: 30px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <a href="about.html" class="nav-active">About</a>
    <a href="index.html">Writing</a>
    <span class="nav-spacer"></span>
  </div>
</header>

<main class="page">
  <div class="content">

    <h1 class="name">Trung Hieu</h1>

    <p>
      Systems Engineer with hands-on experience in LLM training, inference optimization, and distributed GPU.
    </p>


    <hr class="rule">

    <ul class="links">
      <li><a href="https://github.com/trunghjieu2506">GitHub</a></li>
      <li><a href="https://www.linkedin.com/in/trunghjieu/">LinkedIn</a></li>
      <!-- <li><a href="mailto:you@example.com">Email</a></li> -->
    </ul>

  </div>
</main>

</body>
</html>
